upstream online_cinema_api_backend {
    server web:8000;
}

server {
    listen 80;
    server_name localhost; # Можна замінити на ваш домен або IP

    location / {
        proxy_pass http://online_cinema_api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
